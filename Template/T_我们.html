<!DOCTYPE html>
<html lang="en-gb" dir="ltr">

<head>
    <stl:include file="@/include/meta.html"></stl:include>
</head>

<body>
    <stl:include file="@/include/header.html"></stl:include>
    <div class="uk-section uk-section-muted">
        <div class="uk-container">
            <stl:include file="@/include/loc.html"></stl:include>
            <div class="uk-grid-small" data-uk-grid>
                <div class="uk-width-auto uk-text-primary"> <span class="uk-margin-xsmall-top" data-uk-icon="icon: {channel.Keywords}; ratio: 2.6"></span> </div>
                <div class="uk-width-expand">
                    <h1 class="uk-article-title uk-margin-remove">{channel.Title}</h1>
                    <p class="uk-text-lead uk-text-muted uk-margin-small-top">{channel.description}</p>
                </div>
            </div>
            <div class="uk-child-width-1-5@m" uk-grid>
                <stl:channels groupChannel="在职">
                    <div>
                        <div class="uk-card uk-card-default uk-card-hover">
                            <a class="uk-position-cover" href="{stl:a}"></a>
                            <div class="uk-card-media-top">
                                <div class="uk-inline-clip uk-transition-toggle" tabindex="0"> <img src="{channel.imageUrl}" alt="{channel.title}" class="uk-width-1-1"> <img class="uk-transition-scale-up uk-position-cover" src="{channel.dtu}" alt="{channel.title}" class="uk-width-1-1"> </div>
                            </div>
                            <div class="uk-card-body" style="padding: 10px;">
                                <h3 class="uk-card-title uk-text-center uk-margin-remove">{channel.hiname}</h3>
                                <!-- <p class="uk-text-center">
                                    <stl:channel type="content" iscleartags="true"></stl:channel>
                                </p> -->
                            </div>
                        </div>
                        <!--<p class="uk-margin-top uk-text-center jo-text-no">
                            <stl:if type="ChannelName" value="赵彦兵">
                                <stl:no>
                                    <stl:channels channelName="锦旗">
                                        <div class="years-box">
                                            <div class="years-text">
                                                <stl:channel type="title" />
                                            </div>
                                            <div class="years-text">
                                                <stl:contents>
                                                    <a href="javascript:;" uk-tooltip="title: {content.title};" class="jo-flag">{content.subtitle}</a>
                                                </stl:contents>
                                            </div>
                                        </div>
                                    </stl:channels>
                                </stl:no>
                                <stl:yes>
                                    <stl:channels channelName="锦旗">
                                        <div class="years-box">
                                            <div class="years-text">
                                                <stl:channel type="title" />
                                            </div>
                                            <div class="years-text">
                                                <stl:contents>
                                                    <a href="javascript:;" uk-tooltip="title: {content.title};" class="jo-flag no-flag">{content.subtitle}</a>
                                                </stl:contents>
                                            </div>
                                        </div>
                                    </stl:channels>
                                </stl:yes>
                            </stl:if>
                        </p>-->
                    </div>
                </stl:channels>
            </div>
            <div class="uk-placeholder uk-text-center">我们的置顶推文~</div>
            <stl:contents channelName="我们" scope="all" isTop="true">
                <stl:itemTemplate type="Item">
                    <div class="uk-card uk-card-default uk-grid-collapse uk-child-width-1-2@m uk-margin" uk-grid> <a class="uk-position-cover uk-width-1-1" href="{stl:a}"></a>
                        <div class="uk-card-media-left uk-cover-container uk-width-1-3"> <img src="{content.imageUrl}" alt="" uk-cover> <canvas width="600" height="400"></canvas> </div>
                        <div class="uk-width-2-3">
                            <div class="uk-card-body">
                                <h3 class="uk-card-title">{content.title}</h3>
                                <div class="uk-card-badge uk-label">{content.adddate}</div>
                                <p>
                                    <stl:content type="content" isClearTags="true" wordNum="100"></stl:content>
                                </p>
                            </div>
                        </div>
                    </div>
                </stl:itemTemplate>
                <stl:itemTemplate type="AlternatingItem">
                    <div class="uk-card uk-card-default uk-grid-collapse uk-child-width-1-2@m uk-margin" uk-grid> <a class="uk-position-cover uk-width-1-1" href="{stl:a}"></a>
                        <div class="uk-flex-last@s uk-card-media-right uk-cover-container uk-width-1-3"> <img src="{content.imageUrl}" alt="" uk-cover> <canvas width="600" height="400"></canvas> </div>
                        <div class="uk-width-2-3">
                            <div class="uk-card-body">
                                <h3 class="uk-card-title">{content.title}</h3>
                                <div class="uk-card-badge uk-label">{content.adddate}</div>
                                <p>
                                    <stl:content type="content" isClearTags="true" wordNum="100"></stl:content>
                                </p>
                            </div>
                        </div>
                    </div>
                </stl:itemTemplate>
            </stl:contents>
        </div>
    </div>
    </div>
    <stl:include file="@/include/nav.html" />
    <stl:include file="@/include/footer.html" />
</body>

</html>
