<!DOCTYPE html>
<html lang="en-gb" dir="ltr">

<head>
    <stl:include file="@/include/meta.html"></stl:include>
</head>

<body>
    <stl:include file="@/include/header.html"></stl:include>
    <div class="uk-section uk-section-muted">
        <div class="uk-container  uk-container-large">
            <div class="uk-child-width-1-3@l uk-grid-match- uk-grid-small" data-uk-grid>
                <!-- 产品线 -->
                <stl:channels channelIndex="产品大全" groupChannel="PD" totalNum="4">
                    <div>
                        <div class="uk-card uk-card uk-card-default uk-card-hover uk-card-body uk-inline uk-border-rounded"> <a class="uk-position-cover" href="{stl:a}"></a>
                            <div class="uk-grid-small" data-uk-grid>
                                <div class="uk-width-expand">
                                    <h3 class="uk-card-title uk-margin-remove uk-text-primary">
                                        <stl:channel type="Title"></stl:channel> <span class="uk-badge">共<stl:count type="Contents" channelIndex="{channel.title}" scope="All"></stl:count>条QA</span>
                                    </h3>
                                    <p class="uk-text-muted uk-margin-remove">
                                        <stl:channel type="description" wordNum="34"></stl:channel>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </stl:channels>
            </div>
        </div>
    </div>
    <div class="uk-section uk-section-muted jo-index">
        <div class="uk-container uk-container-small">
            <h2 class="uk-text-center">
                <stl:a channelName="我们" class="uk-link-heading uk-link-reset">推文</stl:a>
            </h2>
            <ul class="uk-margin-medium-top" data-uk-accordion="multiple: true">
                <stl:contents channelname="我们" scope="all" order="adddate" isTop="true" totalNum="7">
                    <li> <a class="uk-accordion-title uk-box-shadow-hover-small" href="#">{content.title}</a>
                        <div class="uk-article-content uk-accordion-content link-primary">
                            <div class="uk-card uk-card-default">
                                <div class="uk-card-body">
                                    <stl:content type="content" wordNum="300" iscleartags="true"></stl:content>
                                </div>
                                <div class="uk-card-footer uk-text-right"> <a class="uk-button uk-button-text" href="{stl:a}" target="_blank"> 更多</a> </div>
                            </div>
                        </div>
                    </li>
                </stl:contents>
            </ul>
        </div>
    </div>
    <stl:include file="@/include/nav.html"></stl:include>
    <stl:include file="@/include/footer.html"></stl:include>
</body>

</html>
